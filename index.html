<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Christian David Cruz Barrera — Ingeniero de Software Full-Stack (Angular, .NET, Python)</title>
        <meta name="author" content="Christian David Cruz Barrera" />
        <meta
            name="description"
            content="Ingeniero de Software Full-Stack con 4+ años de experiencia. Angular 20, TypeScript, C#/.NET, Umbraco, Python, Selenium, QA Automation/SDET, IA aplicada al desarrollo. Colombia." />
        <meta
            name="keywords"
            content="Ingeniero de Software, Full-Stack Developer, Frontend, Backend, Angular, TypeScript, RxJS, C#, .NET, Umbraco, Python, Selenium, QA Automation, SDET, Page Object Model, PyTest, NUnit, REST APIs, Redis, AWS, Azure DevOps, CI/CD, Git, Prompt Engineering, GitHub Copilot, Colombia" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
            rel="stylesheet" />

        <!-- Tailwind CSS (CDN) -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Estilos propios de la hoja A4 -->
        <link rel="stylesheet" href="./css/styles.css" />
    </head>
    <body>
        <div id="app" v-cloak>
            <!-- Estado de error de carga de datos -->
            <div
                v-if="loadError"
                class="mx-auto mt-16 max-w-xl rounded-lg border border-red-200 bg-red-50 p-6 text-center text-sm text-red-700">
                No se pudo cargar <b>data/content.json</b>. Abre el proyecto con un servidor local
                (por ejemplo, la extensión <b>Live Server</b> de VS Code) en lugar de hacer doble
                clic sobre el archivo.
            </div>

            <template v-else-if="c">
                <!-- Barra de acciones (Tailwind) -->
                <div class="print-bar no-print">
                    <button
                        type="button"
                        class="language"
                        @click="toggleLanguage">
                        {{ c.meta.toggleLabel }}
                    </button>
                    <button
                        type="button"
                        class="secondary"
                        :disabled="generatingPng"
                        @click="downloadPng">
                        {{ generatingPng ? c.ui.generatingPng : c.ui.downloadPng }}
                    </button>
                    <button
                        type="button"
                        @click="downloadPdf">
                        {{ c.ui.downloadPdf }}
                    </button>
                </div>

                <!-- Hoja del CV -->
                <div class="sheet" ref="sheet">
                    <header>
                        <div>
                            <h1 class="name">{{ c.header.name }}</h1>
                            <div class="role">{{ c.header.role }}</div>
                        </div>
                        <div class="contact">
                            <span
                                ><b>{{ c.header.contact.telLabel }}</b>
                                <a
                                    :href="c.header.contact.whatsapp"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    :aria-label="c.header.contact.whatsappAria"
                                    >{{ c.header.contact.phone }}</a
                                ></span
                            >
                            <span
                                ><a :href="'mailto:' + c.header.contact.email">{{
                                    c.header.contact.email
                                }}</a></span
                            >
                            <span
                                ><a
                                    :href="c.header.contact.linkedinUrl"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    >{{ c.header.contact.linkedin }}</a
                                ></span
                            >
                            <span
                                ><a
                                    :href="c.header.contact.githubUrl"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    >{{ c.header.contact.github }}</a
                                ></span
                            >
                            <span>{{ c.header.contact.country }}</span>
                        </div>
                    </header>

                    <div class="highlights">
                        <div class="hl" v-for="(h, i) in c.highlights" :key="i">
                            <span class="num">{{ h.num }}</span
                            ><span class="lbl">{{ h.lbl }}</span>
                        </div>
                    </div>

                    <section>
                        <h2 class="section-title">{{ c.sections.profile }}</h2>
                        <p class="summary" v-html="c.profile"></p>
                    </section>

                    <section>
                        <h2 class="section-title">{{ c.sections.skills }}</h2>
                        <div class="skill-row" v-for="(s, i) in c.skills" :key="i">
                            <span class="skill-cat">{{ s.cat }}</span
                            ><span class="skill-val">{{ s.val }}</span>
                        </div>
                    </section>

                    <section>
                        <h2 class="section-title">{{ c.sections.softSkills }}</h2>
                        <p class="softskills">{{ c.softSkills }}</p>
                    </section>

                    <section>
                        <h2 class="section-title">{{ c.sections.experience }}</h2>

                        <div class="company">
                            <span class="company-name"
                                >{{ c.experience.company }}&nbsp;<span class="company-former"
                                    >{{ c.experience.former }}</span
                                ></span
                            >
                            <span class="company-meta">{{ c.experience.location }}</span>
                        </div>

                        <div class="exp-item" v-for="(role, i) in c.experience.roles" :key="i">
                            <div class="exp-head">
                                <h3 class="exp-role">{{ role.title }}</h3>
                                <span class="exp-date">{{ role.date }}</span>
                            </div>
                            <ul class="bullets">
                                <li v-for="(b, j) in role.bullets" :key="j">{{ b }}</li>
                            </ul>
                        </div>
                    </section>

                    <section>
                        <h2 class="section-title">{{ c.sections.projects }}</h2>

                        <div class="proj-item" v-for="(p, i) in c.projects" :key="i">
                            <div class="proj-head">
                                <h3 class="proj-name">{{ p.name }}</h3>
                                <span class="proj-role">{{ p.role }}</span>
                            </div>
                            <div class="proj-stack">{{ p.stack }}</div>
                            <p class="proj-desc">{{ p.desc }}</p>
                            <a class="proj-link" :href="p.url">{{ p.link }}</a>
                        </div>
                    </section>
                    

                    <section>
                        <h2 class="section-title">{{ c.sections.education }}</h2>
                        <div class="edu-item" v-for="(e, i) in c.education" :key="i">
                            <div class="edu-title">{{ e.title }}</div>
                            <div class="edu-meta">{{ e.meta }}</div>
                        </div>
                    </section>

                    <section>
                        <h2 class="section-title">{{ c.sections.courses }}</h2>

                        <div class="edu-item" v-for="(course, i) in c.courses" :key="i">
                            <div class="edu-title">
                                <a :href="course.url" target="_blank" rel="noopener noreferrer"
                                    >{{ course.title }}</a
                                >
                            </div>
                            <div class="edu-meta">{{ course.meta }}</div>
                        </div>
                    </section>

                    <section>
                        <h2 class="section-title">{{ c.sections.languages }}</h2>
                        <div class="inline-row" v-for="(l, i) in c.languages" :key="i">
                            <span class="k">{{ l.k }}</span
                            ><span class="v">{{ l.v }}</span>
                        </div>
                    </section>
                </div>
            </template>
        </div>

        <!-- Vue 3 (build global con compilador de templates) -->
        <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
        <!-- Librería para exportar a PNG -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
        <!-- App -->
        <script src="./js/app.js"></script>
    </body>
</html>
